[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flag-doctor"
version = "0.1.0"
description = "An AI agent that finds stale Flagsmith feature flags and safely removes them from your code - with a human approving every change."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.70",
    "requests>=2.31",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
gemini = ["google-genai>=1.0"]

[project.scripts]
flagdoctor = "flag_doctor.cli:main"

[tool.setuptools.packages.find]
include = ["flag_doctor*"]
